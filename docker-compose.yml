services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve
    container_name: nomad-wikipedia
    volumes:
      - ./data/zim:/data
    command: "*.zim"
    ports:
      - "8081:8080"
    restart: unless-stopped

  maps:
    image: protomaps/go-pmtiles
    container_name: nomad-maps
    volumes:
      - ./data/maps:/data
    command: serve --cors="*" /data
    ports:
      - "8082:8080"
    restart: unless-stopped

  portal:
    image: nginx:alpine
    container_name: nomad-portal
    volumes:
      - ./portal:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: nomad-chat-db
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  chat:
    build:
      context: https://github.com/NodeBB/NodeBB.git#master
    container_name: nomad-chat
    depends_on:
      - redis
    ports:
      - "4567:4567"
    environment:
      - url=http://10.42.0.1:4567
      - secret=nomad-secret-key-123
      - database=redis
      - redis__host=redis
      - redis__port=6379
      - redis__database=0
    volumes:
      - ./data/chat_uploads:/usr/src/app/public/uploads
    restart: unless-stopped

