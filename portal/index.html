<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>N.O.M.A.D. PL - Centrala</title>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #1e1e2e; /* Ciemne tło */
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header { 
            margin-top: 50px;
            margin-bottom: 40px;
            text-align: center; 
        }

        .header h1 {
            color: #89b4fa;
            font-size: 2.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header p {
            color: #a6adc8;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* Kontener na kafelki */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 800px;
        }

        /* Styl pojedynczego kafelka */
        .tile {
            background-color: #313244;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: #f5c2e7;
            border: 2px solid #45475a;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
        }

        .tile:hover {
            transform: translateY(-5px);
            border-color: #89b4fa;
            box-shadow: 0 15px 25px rgba(0,0,0,0.4);
            background-color: #45475a;
        }

        .tile-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .tile-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #cdd6f4;
        }
        
        .tile-desc {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #a6adc8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>N.O.M.A.D. PL</h1>
        <p>Węzeł Przetrwania | Offline Knowledge Base</p>
    </div>

    <div class="grid">
        <a href="#" onclick="window.location.href = 'http://' + window.location.hostname + ':4567'; return false;" class="tile">
            <div class="tile-icon">💬</div>
            <div class="tile-title">Lokalny Czat</div>
            <div class="tile-desc">Komunikacja tekstowa z innymi osobami w zasięgu Węzła.</div>
        </a>

        <a href="#" onclick="window.location.href = 'http://' + window.location.hostname + ':8081'; return false;" class="tile">
            <div class="tile-icon">📚</div>
            <div class="tile-title">Baza Wiedzy</div>
            <div class="tile-desc">Archiwum Wikipedii, poradniki przetrwania i literatura medyczna.</div>
        </a>

        <a href="mapa.html" class="tile">
            <div class="tile-icon">🗺️</div>
            <div class="tile-title">Mapa</div>
            <div class="tile-desc">Interaktywna mapa wektorowa Polski z numerami budynków.</div>
        </a>
    </div>

</body>
</html>
